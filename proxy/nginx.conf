# Standalone nginx in front of Immich for older webOS TVs.
# Immich stays on 127.0.0.1:2283. Alcove uses http://<laptop>:2284.
# webOS 25 usually does not need this.

worker_processes 1;
error_log /tmp/alcove-nginx-error.log;
pid /tmp/alcove-nginx.pid;

events {
    worker_connections 128;
}

http {
    server {
        listen 2284;
        server_name _;

        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Headers "x-api-key, content-type, accept";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                return 204;
            }

            proxy_pass http://127.0.0.1:2283;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers "x-api-key, content-type, accept" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        }
    }
}
